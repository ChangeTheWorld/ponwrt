name: PonWrt Build

on:
  workflow_dispatch:
    inputs:
      soc:
        description: "Target SoC"
        type: choice
        required: true
        default: an7581
        options:
          - an7581
          - an7583

  push:
    branches:
      - master
    paths:
      - "configs/**"
      - "feeds.conf.default"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake \
            cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf help2man intltool \
            libelf-dev libncurses-dev libssl-dev libpython3-dev \
            libreadline-dev libtool libyaml-dev libz-dev lld llvm \
            ninja-build patch pkgconf python3 python3-pip \
            python3-pyelftools rsync scons squashfs-tools subversion \
            swig texinfo unzip wget zlib1g-dev zstd

      - name: Update feeds
        run: |
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          ./scripts/feeds install -a

      - name: Select target configuration
        run: |
          SOC="${{ inputs.soc || 'an7581' }}"
          cp "configs/${SOC}.config" .config

      - name: Enable ONU CONFIG
        run: |
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_airoha-pond=y
          CONFIG_PACKAGE_airoha-ponctl=y
          CONFIG_PACKAGE_airoha-pon-debug=y
          CONFIG_PACKAGE_luci-app-onu=y
          CONFIG_PACKAGE_luci-app-pon-status=y
          EOF

      - name: Generate config
        run: |
          make defconfig

      - name: Download packages
        run: |
          make download -j8

      - name: Compile
        run: |
          make -j2 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-${{ inputs.soc || 'an7581' }}
          path: |
            bin/targets/airoha/${{ inputs.soc || 'an7581' }}/
          if-no-files-found: error
          retention-days: 14
